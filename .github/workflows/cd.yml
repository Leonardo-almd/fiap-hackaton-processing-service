name: CD — processing-service

on:
  workflow_run:
    workflows: ["CI — processing-service"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Extract version from POM
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT

      - name: CD Prepare Summary
        if: always()
        run: |
          {
            echo "## CD Summary - Prepare"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Version | ${{ steps.version.outputs.image_tag }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      image_uri: ${{ steps.publish_image.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: publish_image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: CD Publish Summary
        if: always()
        run: |
          {
            echo "## CD Summary - Publish"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Image | ${{ steps.publish_image.outputs.image_uri }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download ECS task definition
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].taskDefinition" \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.publish.outputs.image_uri }}

      - name: Deploy to ECS
        id: ecs_deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: CD Deploy Summary
        if: always()
        run: |
          {
            echo "## CD Summary - ECS Deploy"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Image | ${{ needs.publish.outputs.image_uri }} |"
            echo "| Service | ${{ env.ECS_SERVICE }} |"
            echo "| Cluster | ${{ env.ECS_CLUSTER }} |"
            echo "| Result | ${{ steps.ecs_deploy.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
