name: CI — processing-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: "-Xmx1024m"
  SERVICE_NAME: processing-service

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build with Maven
        id: build_step
        run: mvn clean compile -B

      - name: Run Unit Tests
        id: unit_tests
        run: mvn test -B

      - name: Run Integration Tests
        id: integration_tests
        run: mvn verify -DskipUnitTests -B

      - name: CI Build Summary
        if: always()
        run: |
          {
            echo "## CI Summary - Build and Test"
            echo
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Build | ${{ steps.build_step.outcome }} |"
            echo "| Unit Tests | ${{ steps.unit_tests.outcome }} |"
            echo "| Integration Tests | ${{ steps.integration_tests.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        id: checkstyle
        run: mvn checkstyle:check -B
        continue-on-error: true

      - name: Run SpotBugs
        id: spotbugs
        run: mvn spotbugs:check -B
        continue-on-error: true

      - name: Code Quality Summary
        if: always()
        run: |
          {
            echo "## CI Summary - Code Quality"
            echo
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Checkstyle | ${{ steps.checkstyle.outcome }} |"
            echo "| SpotBugs | ${{ steps.spotbugs.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: OWASP Dependency Check
        id: owasp
        run: mvn org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: target/dependency-check-report.html
          retention-days: 7

      - name: Security Summary
        if: always()
        run: |
          {
            echo "## CI Summary - Security"
            echo
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| OWASP Dependency Check | ${{ steps.owasp.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and Run Tests with Coverage
        run: mvn clean verify jacoco:report -B

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Summary
        if: always()
        run: |
          {
            echo "## CI Summary - SonarCloud"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Project Key | ${{ vars.SONAR_PROJECT_KEY }} |"
            echo "| Organization | ${{ vars.SONAR_ORGANIZATION }} |"
            echo "| Dashboard | https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, code-quality, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Build Summary
        if: always()
        run: |
          {
            echo "## CI Summary - Docker Build"
            echo
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Docker Build | ${{ steps.docker_build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
