# =====================================================
# SonarCloud Configuration
# =====================================================

# Identificacao do projeto (valores passados via CI)
# sonar.projectKey e sonar.organization sao definidos no workflow

# Metadados
sonar.projectName=processing-service
sonar.projectVersion=1.0.0-SNAPSHOT

# Codigo fonte
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Cobertura (JaCoCo)
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Relatorios de testes
sonar.junit.reportPaths=target/surefire-reports

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusoes (opcional - ajuste conforme necessario)
sonar.exclusions=**/config/**,**/dto/**,**/exception/**
sonar.coverage.exclusions=**/Application.java,**/config/**,**/dto/**

# Analise de duplicacao
sonar.cpd.exclusions=**/dto/**,**/entity/**
